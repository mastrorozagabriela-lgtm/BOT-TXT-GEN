<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Fluxos - Bot Texto Generativo (Sem Parar)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-screen flex overflow-hidden text-slate-800">

    <!-- SIDEBAR -->
    <aside class="w-80 bg-slate-900 text-white flex flex-col shadow-xl z-20">
        <div class="p-5 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-rose-600 flex items-center justify-center font-bold text-lg shadow">
                    SP
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-wide">BOT TXT GEN</h1>
                    <p class="text-xs text-slate-400">Assistente Virtual: Duda</p>
                </div>
            </div>
        </div>

        <!-- Busca de Fluxos -->
        <div class="p-4 border-b border-slate-800">
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-3 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" onkeyup="renderSidebar()" placeholder="Buscar fluxo ou fala..." class="w-full bg-slate-800 text-sm text-white pl-8 pr-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-rose-500">
            </div>
        </div>

        <!-- Lista de Fluxos -->
        <div id="flowList" class="flex-1 overflow-y-auto p-3 space-y-1">
            <!-- Preenchido via JS -->
        </div>

    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Header do Fluxo Selecionado -->
        <header id="mainHeader" class="bg-white border-b border-slate-200 px-8 py-5 flex items-center justify-between shadow-sm">
            <div>
                <div class="flex items-center gap-3">
                    <span id="flowCategoryBadge" class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-rose-100 text-rose-700">Negociação</span>
                    <span id="stepCountBadge" class="text-xs text-slate-500 font-medium">4 etapas</span>
                </div>
                <h2 id="flowTitle" class="text-2xl font-bold text-slate-800 mt-1">1. Acordo à Vista</h2>
            </div>
        </header>

        <!-- Conteúdo do Fluxograma -->
        <div class="flex-1 overflow-y-auto p-8">
            <div class="max-w-4xl mx-auto">
                
                <!-- Card de Observações / Regra de Negócio -->
                <div id="observationBox" class="mb-8 bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-lg shadow-sm hidden">
                    <div class="flex items-start gap-3">
                        <i class="fas fa-lightbulb text-amber-500 mt-0.5"></i>
                        <div>
                            <h4 class="text-xs font-bold uppercase tracking-wider text-amber-800">Regra de Negócio / Observação</h4>
                            <p id="observationText" class="text-sm text-amber-900 mt-1"></p>
                        </div>
                    </div>
                </div>

                <!-- Container das Etapas do Fluxograma -->
                <div id="stepsContainer" class="space-y-6">
                    <!-- Preenchido via JS -->
                </div>

            </div>
        </div>
    </main>

    <!-- TOAST DE NOTIFICAÇÃO -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 z-50">
        <i class="fas fa-check-circle text-emerald-400"></i>
        <span id="toastMsg">Fala copiada com sucesso!</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
